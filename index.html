<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle de Calcul Mental</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Comic Sans MS', sans-serif, Arial;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      margin: 0;
      padding: 10px;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }
    h1 { color: #ff4757; margin: 5px 0; font-size: 22px; }
    #reward-banner {
      font-size: 15px;
      font-weight: bold;
      color: #b33939;
      background: #fff0f0;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    #round-indicator {
      font-size: 14px;
      font-weight: bold;
      color: #2f3542;
      background: #ffffffaa;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    #scoreboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 900px;
      margin: 0 auto 10px auto;
    }
    .player-pill {
      background: #ffffffcc;
      border: 3px solid #ccc;
      border-radius: 12px;
      padding: 6px 10px;
      min-width: 80px;
      font-size: 13px;
      font-weight: bold;
      transition: all 0.2s ease;
      opacity: 0.5;
    }
    .player-pill.active {
      opacity: 1;
      transform: scale(1.08);
      border-color: #2ed573;
      background: #e8f8f0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .pill-score { font-size: 16px; color: #ff4757; }

    #center-zone {
      background: #ffffffdd;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    #turn-banner { font-size: 22px; font-weight: bold; margin-bottom: 5px; color: #2f3542; }
    #question {
      font-size: 44px;
      font-weight: bold;
      color: #2f3542;
      background: #fff;
      padding: 5px 20px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    #timer-container {
      width: 80%;
      height: 14px;
      background: #dfe4ea;
      border-radius: 10px;
      margin: 10px auto 5px auto;
      overflow: hidden;
      display: none;
      border: 1px solid #ced6e0;
    }
    #timer-bar {
      height: 100%;
      width: 100%;
      background: #2ed573;
      border-radius: 10px;
      transition: width 0.1s linear, background-color 0.3s ease;
    }

    #display-answer {
      font-size: 30px;
      font-weight: bold;
      height: 42px;
      line-height: 42px;
      width: 140px;
      margin: 6px auto;
      background: #fff;
      border: 3px solid #70a1ff;
      border-radius: 10px;
      color: #2f3542;
    }
    
    #keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: 270px;
      margin: 8px auto;
    }
    .key-btn {
      background: #f1f2f6;
      border: 2px solid #ced6e0;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      color: #2f3542;
      padding: 10px 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .key-btn:active { background: #dfe4ea; transform: translateY(2px); }
    .btn-clear { background: #ff6b81; color: white; border-color: #ee5253; }
    .btn-ok { background: #2ed573; color: white; border-color: #26af5f; grid-column: span 3; font-size: 20px; padding: 10px; }

    #status { font-size: 15px; font-weight: bold; min-height: 20px; margin-top: 5px; }

    .overlay-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .names-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 500px;
      margin: 12px 0;
      max-height: 22vh;
      overflow-y: auto;
    }
    .name-input, .reward-input {
      font-size: 16px;
      font-weight: bold;
      padding: 8px;
      border-radius: 8px;
      border: none;
      text-align: center;
      outline: none;
      -webkit-appearance: none;
    }
    .name-input { width: 140px; }
    .reward-input { width: 230px; background: #fffedb; color: #2f3542; }
    select {
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: bold;
      margin: 2px 0;
      background: #fff;
    }
    .btn-action {
      padding: 14px 30px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      background: #2ed573;
      color: white;
      margin-top: 15px;
      touch-action: manipulation;
    }
    .trophy { font-size: 60px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
    #leaderboard {
      margin: 10px 0;
      font-size: 16px;
      line-height: 1.6;
      text-align: left;
      background: rgba(255,255,255,0.1);
      padding: 12px 20px;
      border-radius: 10px;
      max-height: 240px;
      overflow-y: auto;
      width: 90%;
      max-width: 450px;
    }
    .rank-line {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding: 4px 0;
    }
  </style>
</head>
<body>

  <div id="start-screen" class="overlay-screen">
    <div style="font-size: 45px;">🎯⚔️</div>
    <h2 style="color: #ffd32a; margin: 5px 0 10px 0;">Battle de Calcul Mental</h2>
    
    <div style="display:flex; flex-direction:column; gap:6px; align-items:center;">
      <div>
        <label for="operation-type" style="font-size: 15px;">➕ Opération : </label>
        <select id="operation-type">
          <option value="mult" selected>Multiplications (×)</option>
          <option value="add">Additions (+)</option>
          <option value="sub">Soustractions (−)</option>
          <option value="div">Divisions (÷)</option>
          <option value="mix">Mélange Aléatoire</option>
        </select>
      </div>

      <div>
        <label for="questions-count" style="font-size: 15px;">📝 Questions par joueur : </label>
        <select id="questions-count">
          <option value="5">5 questions (rapide)</option>
          <option value="10">10 questions</option>
          <option value="15">15 questions</option>
          <option value="20" selected>20 questions</option>
          <option value="30">30 questions (marathon)</option>
        </select>
      </div>

      <div>
        <label for="game-reward" style="font-size: 15px;">🎁 Lot : </label>
        <input type="text" id="game-reward" class="reward-input" placeholder="Ex: Une glace" value="Une super glace 🍦">
      </div>

      <div>
        <label for="player-count" style="font-size: 15px;">👥 Joueurs : </label>
        <select id="player-count" onchange="renderNameInputs()">
          <option value="1">1 Joueur</option>
          <option value="2" selected>2 Joueurs</option>
          <option value="3">3 Joueurs</option>
          <option value="4">4 Joueurs</option>
          <option value="5">5 Joueurs</option>
          <option value="6">6 Joueurs</option>
          <option value="7">7 Joueurs</option>
          <option value="8">8 Joueurs</option>
          <option value="9">9 Joueurs</option>
          <option value="10">10 Joueurs</option>
        </select>
      </div>

      <div>
        <label for="time-limit" style="font-size: 15px;">⏱️ Temps par tour : </label>
        <select id="time-limit">
          <option value="0">Illimité</option>
          <option value="20">20 secondes</option>
          <option value="15">15 secondes</option>
          <option value="10" selected>10 secondes</option>
          <option value="8">8 secondes</option>
          <option value="5">5 secondes</option>
        </select>
      </div>
    </div>

    <div id="names-list" class="names-container"></div>
    <button id="btn-start" type="button" class="btn-action">Lancer le Défi !</button>
  </div>

  <h1>⚔️ Le Grand Défi des Maths ⚔️</h1>
  <div><span id="reward-banner">🎁 En jeu : Une super glace 🍦</span></div>
  <div id="round-indicator">Manche : 1 / 20</div>

  <div id="scoreboard"></div>

  <div id="center-zone">
    <div id="turn-banner">À toi !</div>
    <div id="question">?</div>

    <div id="timer-container">
      <div id="timer-bar"></div>
    </div>

    <div id="display-answer"></div>

    <div id="keypad">
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>
      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>
      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>
      <button class="key-btn btn-clear" onclick="clearKey()">⌫</button>
      <button class="key-btn" onclick="pressKey('0')">0</button>
      <button class="key-btn btn-clear" onclick="resetKey()">C</button>
      <button class="key-btn btn-ok" onclick="validate()">VALIDER</button>
    </div>

    <div id="status">Touche les chiffres pour répondre !</div>
  </div>

  <div id="winner-screen" class="overlay-screen" style="display: none;">
    <div class="trophy">🏆🎁🎉</div>
    <h2 id="winner-text" style="font-size: 26px; color: #ffd32a; margin-bottom: 5px;"></h2>
    <p id="won-reward-text" style="font-size: 20px; color: #7bed9f; margin-top: 0; font-weight: bold;"></p>
    <div id="leaderboard"></div>
    <button class="btn-action" onclick="resetToSetup()">Nouvelle Partie</button>
  </div>

  <script>
    let maxRegularRounds = 20;
    let round = 1;
    let players = [];
    let currentPlayerIndex = 0;
    let correctAnswer = 0;
    let currentInput = "";
    let isSuddenDeath = false;
    let tiedPlayerIndices = [];
    let chosenReward = "Une super glace 🍦";
    let selectedOp = "mult";

    // GESTION DES TEMPS
    let timeLimitSeconds = 10;
    let timerInterval = null;
    let timeRemainingMs = 0;
    let questionStartTime = 0;
    const TIMER_STEP_MS = 100;

    const displayBox = document.getElementById('display-answer');
    const statusBox = document.getElementById('status');
    const qBox = document.getElementById('question');
    const roundLabel = document.getElementById('round-indicator');
    const turnBanner = document.getElementById('turn-banner');
    const scoreboard = document.getElementById('scoreboard');
    const timerBar = document.getElementById('timer-bar');
    const timerContainer = document.getElementById('timer-container');
    const rewardBanner = document.getElementById('reward-banner');

    function renderNameInputs() {
      const count = parseInt(document.getElementById('player-count').value, 10) || 2;
      const container = document.getElementById('names-list');
      container.innerHTML = "";
      for (let i = 1; i <= count; i++) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'name-input';
        inp.id = `input-player-${i}`;
        inp.placeholder = `Joueur ${i}`;
        inp.value = `Joueur ${i}`;
        container.appendChild(inp);
      }
    }
    renderNameInputs();

    const startBtn = document.getElementById('btn-start');
    startBtn.addEventListener('click', handleStart);
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      handleStart();
    });

    function handleStart() {
      if (document.activeElement) document.activeElement.blur();

      const count = parseInt(document.getElementById('player-count').value, 10) || 2;
      timeLimitSeconds = parseInt(document.getElementById('time-limit').value, 10);
      maxRegularRounds = parseInt(document.getElementById('questions-count').value, 10) || 20;
      selectedOp = document.getElementById('operation-type').value;
      
      const customReward = document.getElementById('game-reward').value.trim();
      chosenReward = customReward !== "" ? customReward : "Une super récompense !";
      rewardBanner.innerText = `🎁 En jeu : ${chosenReward}`;

      players = [];
      for (let i = 1; i <= count; i++) {
        const el = document.getElementById(`input-player-${i}`);
        const val = el ? el.value.trim() : "";
        players.push({
          name: val !== "" ? val : `Joueur ${i}`,
          score: 0,
          shots: 0,
          totalTimeMs: 0
        });
      }

      document.getElementById('start-screen').style.display = 'none';
      initGame();
    }

    function initGame() {
      round = 1;
      currentPlayerIndex = 0;
      isSuddenDeath = false;
      tiedPlayerIndices = [];
      players.forEach(p => { p.score = 0; p.shots = 0; p.totalTimeMs = 0; });

      buildScoreboard();
      document.getElementById('winner-screen').style.display = 'none';
      roundLabel.style.background = '#ffffffaa';
      roundLabel.style.color = '#2f3542';
      statusBox.innerText = 'Touche les chiffres pour répondre !';

      if (timeLimitSeconds > 0) {
        timerContainer.style.display = 'block';
      } else {
        timerContainer.style.display = 'none';
      }

      nextQuestion();
    }

    function buildScoreboard() {
      scoreboard.innerHTML = "";
      players.forEach((p, idx) => {
        const pill = document.createElement('div');
        pill.className = 'player-pill';
        pill.id = `pill-player-${idx}`;
        pill.innerHTML = `<div>${p.name}</div><div class="pill-score"><span id="score-${idx}">0</span> pts</div>`;
        scoreboard.appendChild(pill);
      });
    }

    function startTimer() {
      clearInterval(timerInterval);
      questionStartTime = Date.now();

      if (timeLimitSeconds <= 0) return;

      timeRemainingMs = timeLimitSeconds * 1000;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timeRemainingMs -= TIMER_STEP_MS;
        updateTimerDisplay();

        if (timeRemainingMs <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, TIMER_STEP_MS);
    }

    function updateTimerDisplay() {
      const totalMs = timeLimitSeconds * 1000;
      const pct = Math.max(0, (timeRemainingMs / totalMs) * 100);
      timerBar.style.width = pct + '%';

      if (pct > 50) {
        timerBar.style.backgroundColor = '#2ed573';
      } else if (pct > 25) {
        timerBar.style.backgroundColor = '#ffa502';
      } else {
        timerBar.style.backgroundColor = '#ff4757';
      }
    }

    function recordElapsed() {
      const elapsed = Date.now() - questionStartTime;
      players[currentPlayerIndex].totalTimeMs += elapsed;
    }

    function handleTimeout() {
      const p = players[currentPlayerIndex];
      recordElapsed();
      p.shots++;
      statusBox.innerHTML = `<span style='color:#ff4757'>⏰ Trop lent ${p.name} ! (${correctAnswer})</span>`;
      moveToNextPlayer();
    }

    function pressKey(num) {
      if (currentInput.length < 4) {
        currentInput += num;
        displayBox.innerText = currentInput;
      }
    }

    function clearKey() {
      currentInput = currentInput.slice(0, -1);
      displayBox.innerText = currentInput;
    }

    function resetKey() {
      currentInput = "";
      displayBox.innerText = "";
    }

    function generateMathProblem() {
      let op = selectedOp;
      if (op === "mix") {
        const ops = ["mult", "add", "sub", "div"];
        op = ops[Math.floor(Math.random() * ops.length)];
      }

      let text = "", ans = 0;

      if (op === "mult") {
        const a = Math.floor(Math.random() * 11);
        const b = Math.floor(Math.random() * 11);
        ans = a * b;
        text = `${a} × ${b}`;
      } else if (op === "add") {
        const a = Math.floor(Math.random() * 51);
        const b = Math.floor(Math.random() * 51);
        ans = a + b;
        text = `${a} + ${b}`;
      } else if (op === "sub") {
        const n1 = Math.floor(Math.random() * 51);
        const n2 = Math.floor(Math.random() * 51);
        const a = Math.max(n1, n2);
        const b = Math.min(n1, n2);
        ans = a - b;
        text = `${a} − ${b}`;
      } else if (op === "div") {
        const b = Math.floor(Math.random() * 9) + 2;
        const result = Math.floor(Math.random() * 11);
        const a = b * result;
        ans = result;
        text = `${a} ÷ ${b}`;
      }

      return { text, ans };
    }

    function nextQuestion() {
      const prob = generateMathProblem();
      correctAnswer = prob.ans;
      qBox.innerText = prob.text;
      resetKey();

      const p = players[currentPlayerIndex];

      if (isSuddenDeath) {
        roundLabel.innerText = "⚡ MORT SUBITE (+1) !";
        roundLabel.style.background = '#ff4757';
        roundLabel.style.color = '#fff';
      } else {
        roundLabel.innerText = `Manche : ${round} / ${maxRegularRounds}`;
      }

      players.forEach((_, idx) => {
        const el = document.getElementById(`pill-player-${idx}`);
        if (el) el.classList.toggle('active', idx === currentPlayerIndex);
      });

      turnBanner.innerText = `À toi ${p.name} !`;
      startTimer();
    }

    function validate() {
      if (currentInput === "") return;
      clearInterval(timerInterval);
      recordElapsed();

      const userAns = parseInt(currentInput, 10);
      const isCorrect = (userAns === correctAnswer);
      const p = players[currentPlayerIndex];

      p.shots++;
      if (isCorrect) {
        p.score++;
        statusBox.innerHTML = `<span style='color:#2ed573'>Bravo ${p.name} ! +1 pt !</span>`;
      } else {
        statusBox.innerHTML = `<span style='color:#ff4757'>Raté ${p.name} ! C'était ${correctAnswer}.</span>`;
      }

      document.getElementById(`score-${currentPlayerIndex}`).innerText = p.score;
      moveToNextPlayer();
    }

    function moveToNextPlayer() {
      const activePool = isSuddenDeath ? tiedPlayerIndices : players.map((_, i) => i);
      const currentPosInPool = activePool.indexOf(currentPlayerIndex);

      if (currentPosInPool < activePool.length - 1) {
        currentPlayerIndex = activePool[currentPosInPool + 1];
        nextQuestion();
      } else {
        checkCycleEnd();
      }
    }

    function checkCycleEnd() {
      if (!isSuddenDeath) {
        if (round >= maxRegularRounds) {
          if (players.length === 1) {
            endGame();
            return;
          }

          let maxScore = Math.max(...players.map(p => p.score));
          tiedPlayerIndices = players
            .map((p, idx) => p.score === maxScore ? idx : -1)
            .filter(idx => idx !== -1);

          if (tiedPlayerIndices.length > 1) {
            isSuddenDeath = true;
            statusBox.innerHTML = "Égalité ! Manche de Mort Subite !";
            currentPlayerIndex = tiedPlayerIndices[0];
            nextQuestion();
          } else {
            endGame();
          }
        } else {
          round++;
          currentPlayerIndex = 0;
          nextQuestion();
        }
      } else {
        let maxScore = Math.max(...tiedPlayerIndices.map(i => players[i].score));
        let remainingTied = tiedPlayerIndices.filter(i => players[i].score === maxScore);

        if (remainingTied.length === 1) {
          endGame();
        } else {
          tiedPlayerIndices = remainingTied;
          statusBox.innerHTML = "Toujours égalité ! Encore +1 question chacun !";
          currentPlayerIndex = tiedPlayerIndices[0];
          nextQuestion();
        }
      }
    }

    function formatTime(ms) {
      const totalSec = Math.round(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      if (min > 0) {
        return `${min}m ${sec < 10 ? '0' : ''}${sec}s`;
      }
      return `${(ms / 1000).toFixed(1)}s`;
    }

    function endGame() {
      clearInterval(timerInterval);
      const sorted = [...players].sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return a.totalTimeMs - b.totalTimeMs; // Le plus rapide gagne en cas d'égalité finale
      });

      const winner = sorted[0];
      document.getElementById('winner-screen').style.display = 'flex';
      
      if (players.length === 1) {
        document.getElementById('winner-text').innerText = `🎉 Défi relevé pour ${winner.name} !`;
      } else {
        document.getElementById('winner-text').innerText = `🏆 Victoire de ${winner.name} ! 🏆`;
      }

      document.getElementById('won-reward-text').innerText = `Lot remporté : ${chosenReward}`;

      let html = "<strong>Classement & Temps :</strong><br>";
      sorted.forEach((p, rank) => {
        const avg = p.shots > 0 ? (p.totalTimeMs / p.shots / 1000).toFixed(1) : "0";
        html += `
          <div class="rank-line">
            <span><b>${rank + 1}. ${p.name}</b> : ${p.score} pt(s)</span>
            <span>⏱️ ${formatTime(p.totalTimeMs)} (moy. ${avg}s)</span>
          </div>`;
      });
      document.getElementById('leaderboard').innerHTML = html;
    }

    function resetToSetup() {
      clearInterval(timerInterval);
      document.getElementById('winner-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'flex';
    }
  </script>
</body>
</html>
