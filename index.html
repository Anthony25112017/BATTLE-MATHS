<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Battle Maths Multijoueur en Ligne</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Comic Sans MS', sans-serif, Arial;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      margin: 0; padding: 10px; text-align: center;
      user-select: none; -webkit-user-select: none;
    }
    h1 { color: #ff4757; margin: 5px 0; font-size: 22px; }
    .banner {
      font-size: 14px; font-weight: bold; background: #fff0f0; color: #b33939;
      display: inline-block; padding: 4px 12px; border-radius: 20px; margin: 2px 4px;
    }
    #scoreboard {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
      max-width: 900px; margin: 8px auto;
    }
    .player-pill {
      background: #ffffffdd; border: 2px solid #70a1ff; border-radius: 12px;
      padding: 6px 12px; font-size: 13px; font-weight: bold;
    }
    .pill-score { font-size: 16px; color: #ff4757; }

    #center-zone {
      background: #ffffffdd; max-width: 460px; margin: 0 auto;
      padding: 12px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    #question {
      font-size: 46px; font-weight: bold; color: #2f3542; background: #fff;
      padding: 5px 25px; border-radius: 15px; display: inline-block; margin-top: 5px;
    }
    #timer-container {
      width: 80%; height: 12px; background: #dfe4ea; border-radius: 10px;
      margin: 10px auto; overflow: hidden; display: none;
    }
    #timer-bar { height: 100%; width: 100%; background: #2ed573; transition: width 0.1s linear; }

    #display-answer {
      font-size: 32px; font-weight: bold; height: 44px; line-height: 44px;
      width: 140px; margin: 6px auto; background: #fff;
      border: 3px solid #70a1ff; border-radius: 10px; color: #2f3542;
    }
    #keypad {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      max-width: 270px; margin: 8px auto;
    }
    .key-btn {
      background: #f1f2f6; border: 2px solid #ced6e0; border-radius: 10px;
      font-size: 22px; font-weight: bold; color: #2f3542; padding: 10px 0;
      cursor: pointer; touch-action: manipulation;
    }
    .key-btn:active { background: #dfe4ea; }
    .btn-clear { background: #ff6b81; color: white; border-color: #ee5253; }
    .btn-ok { background: #2ed573; color: white; border-color: #26af5f; grid-column: span 3; font-size: 20px; padding: 10px; }

    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92); color: #fff;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 999; padding: 20px;
    }
    input, select {
      font-size: 16px; font-weight: bold; padding: 10px; border-radius: 8px;
      border: none; text-align: center; margin: 5px; outline: none;
    }
    .btn-action {
      padding: 12px 24px; font-size: 18px; font-weight: bold; cursor: pointer;
      border: none; border-radius: 12px; background: #2ed573; color: white; margin: 6px;
      touch-action: manipulation;
    }
    .btn-secondary { background: #ffa502; }
    .btn-danger { background: #ff4757; }
    #room-code-display {
      font-size: 28px; letter-spacing: 2px; color: #ffd32a; font-weight: bold;
      background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 10px;
    }
    #lobby-players { font-size: 18px; color: #7bed9f; margin: 10px 0; }
  </style>
</head>
<body>

  <div id="screen-welcome" class="overlay">
    <div style="font-size: 50px;">🌐🍦⚔️</div>
    <h2 style="color:#ffd32a;">Battle Maths en Ligne</h2>
    <input type="text" id="my-name" placeholder="Ton prénom" value="Joueur 1">
    <div style="margin-top: 15px;">
      <button class="btn-action" onclick="showHostConfig()">Créer un salon</button>
      <button class="btn-action btn-secondary" onclick="showJoinConfig()">Rejoindre un salon</button>
    </div>
  </div>

  <div id="screen-host" class="overlay" style="display:none;">
    <h3 style="color:#ffd32a;">Paramètres de la partie</h3>
    <div>
      <label>Opération : </label>
      <select id="cfg-op">
        <option value="mult" selected>Multiplications (×)</option>
        <option value="add">Additions (+)</option>
        <option value="sub">Soustractions (−)</option>
        <option value="div">Divisions (÷)</option>
        <option value="mix">Mélange</option>
      </select>
    </div>
    <div>
      <label>Questions : </label>
      <select id="cfg-questions">
        <option value="5">5 questions</option>
        <option value="10" selected>10 questions</option>
        <option value="20">20 questions</option>
      </select>
    </div>
    <div>
      <label>Temps : </label>
      <select id="cfg-time">
        <option value="0">Illimité</option>
        <option value="15">15 sec</option>
        <option value="10" selected>10 sec</option>
        <option value="5">5 sec</option>
      </select>
    </div>
    <div>
      <label>Lot : </label>
      <input type="text" id="cfg-reward" value="Une super glace 🍦" style="width: 200px;">
    </div>
    <button class="btn-action" onclick="createRoom()">Ouvrir le salon</button>
  </div>

  <div id="screen-lobby" class="overlay" style="display:none;">
    <h3>Code du Salon à partager :</h3>
    <div id="room-code-display">CONNEXION...</div>
    <p>Donne ce code aux autres joueurs !</p>
    <div id="lobby-players">Joueurs connectés : <br></div>
    <button id="btn-start-game" class="btn-action" style="display:none;" onclick="hostBroadcastStart()">Lancer la partie !</button>
  </div>

  <div id="screen-join" class="overlay" style="display:none;">
    <h3>Entrer le code du salon :</h3>
    <input type="text" id="join-code-input" placeholder="Ex: 1234">
    <br>
    <button class="btn-action" onclick="joinRoom()">Se connecter</button>
  </div>

  <h1>⚔️ Battle en Direct ⚔️</h1>
  <div>
    <span id="banner-reward" class="banner">🎁 Lot : ...</span>
    <span id="banner-round" class="banner">Question : 1 / 10</span>
  </div>

  <div id="scoreboard"></div>

  <div id="center-zone">
    <div id="question">?</div>
    <div id="timer-container"><div id="timer-bar"></div></div>
    <div id="display-answer"></div>

    <div id="keypad">
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>
      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>
      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>
      <button class="key-btn btn-clear" onclick="clearKey()">⌫</button>
      <button class="key-btn" onclick="pressKey('0')">0</button>
      <button class="key-btn btn-clear" onclick="resetKey()">C</button>
      <button class="key-btn btn-ok" onclick="validate()">VALIDER</button>
    </div>
    <div id="status" style="min-height:22px; font-weight:bold; margin-top:5px;"></div>
  </div>

  <div id="screen-winner" class="overlay" style="display:none;">
    <div style="font-size: 55px;">🏆🎉</div>
    <h2 id="winner-name" style="color: #ffd32a; margin: 5px 0;"></h2>
    <p id="winner-reward" style="color:#7bed9f; font-size: 20px; font-weight:bold; margin-top:0;"></p>
    <div id="final-ranks" style="background:rgba(255,255,255,0.1); padding:12px; border-radius:10px; width:85%; max-width:400px;"></div>
    
    <div id="host-end-buttons" style="margin-top: 15px; display:none;">
      <button class="btn-action" onclick="hostReplay()">Rejouer la manche 🔄</button>
      <button class="btn-action btn-danger" onclick="leaveRoom()">Quitter le salon ❌</button>
    </div>
    <div id="client-wait-message" style="margin-top: 15px; color:#ffd32a; font-weight:bold; display:none;">
      En attente de l'hôte pour rejouer...
      <br>
      <button class="btn-action btn-danger" style="margin-top:10px;" onclick="leaveRoom()">Quitter</button>
    </div>
  </div>

  <script>
    let peer = null;
    let connections = [];
    let hostConn = null;
    let isHost = false;
    let myId = "", myName = "";

    let players = {};
    let gameConfig = {};
    let currentQIndex = 0;
    let currentProblem = null;
    let currentInput = "";
    let questionStartTime = 0;
    let timerInterval = null;
    let answeredCurrent = false;

    function showHostConfig() {
      myName = document.getElementById('my-name').value.trim() || "Joueur 1";
      document.getElementById('screen-welcome').style.display = 'none';
      document.getElementById('screen-host').style.display = 'flex';
    }

    function showJoinConfig() {
      myName = document.getElementById('my-name').value.trim() || "Invité";
      document.getElementById('screen-welcome').style.display = 'none';
      document.getElementById('screen-join').style.display = 'flex';
    }

    function createRoom() {
      isHost = true;
      gameConfig = {
        op: document.getElementById('cfg-op').value,
        totalQ: parseInt(document.getElementById('cfg-questions').value, 10),
        time: parseInt(document.getElementById('cfg-time').value, 10),
        reward: document.getElementById('cfg-reward').value.trim() || "Une glace 🍦"
      };

      document.getElementById('screen-host').style.display = 'none';
      document.getElementById('screen-lobby').style.display = 'flex';
      document.getElementById('btn-start-game').style.display = 'inline-block';

      const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
      peer = new Peer("battle-math-" + roomCode);

      peer.on('open', (id) => {
        document.getElementById('room-code-display').innerText = roomCode;
        myId = id;
        players[myId] = { name: myName, score: 0, totalTime: 0 };
        updateLobbyList();
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => handleHostReceiveData(conn, data));
      });

      peer.on('error', () => {
        alert("Erreur de connexion PeerJS, réessaie !");
        location.reload();
      });
    }

    function handleHostReceiveData(conn, data) {
      if (data.type === 'JOIN') {
        players[conn.peer] = { name: data.name, score: 0, totalTime: 0 };
        updateLobbyList();
        broadcast({ type: 'LOBBY_UPDATE', players });
      } else if (data.type === 'SUBMIT_ANSWER') {
        if (players[conn.peer]) {
          if (data.isCorrect) players[conn.peer].score++;
          players[conn.peer].totalTime += data.timeTaken;
        }
        broadcast({ type: 'SCORE_UPDATE', players });
      }
    }

    function updateLobbyList() {
      let html = "Joueurs connectés :<br>";
      Object.values(players).forEach(p => { html += `⭐ ${p.name}<br>`; });
      document.getElementById('lobby-players').innerHTML = html;
    }

    function broadcast(data) {
      connections.forEach(c => { if (c.open) c.send(data); });
    }

    function hostBroadcastStart() {
      // Génère les questions pour la manche
      const questions = [];
      for (let i = 0; i < gameConfig.totalQ; i++) {
        questions.push(generateMathProblem(gameConfig.op));
      }
      gameConfig.questions = questions;

      // Remise à zéro des scores
      Object.keys(players).forEach(id => {
        players[id].score = 0;
        players[id].totalTime = 0;
      });

      broadcast({ type: 'START_GAME', config: gameConfig, players });
      startGameLocally(gameConfig, players);
    }

    function hostReplay() {
      document.getElementById('screen-winner').style.display = 'none';
      hostBroadcastStart();
    }

    function joinRoom() {
      const code = document.getElementById('join-code-input').value.trim();
      if (!code) return;

      peer = new Peer();
      peer.on('open', (id) => {
        myId = id;
        hostConn = peer.connect("battle-math-" + code);

        hostConn.on('open', () => {
          document.getElementById('screen-join').style.display = 'none';
          document.getElementById('screen-lobby').style.display = 'flex';
          document.getElementById('room-code-display').innerText = "Connecté au salon " + code;
          hostConn.send({ type: 'JOIN', name: myName });
        });

        hostConn.on('data', (data) => {
          if (data.type === 'LOBBY_UPDATE') {
            players = data.players;
            updateLobbyList();
          } else if (data.type === 'START_GAME') {
            gameConfig = data.config;
            players = data.players;
            document.getElementById('screen-winner').style.display = 'none';
            startGameLocally(gameConfig, players);
          } else if (data.type === 'SCORE_UPDATE') {
            players = data.players;
            renderScoreboard();
          }
        });
      });
    }

    function startGameLocally(config, currentPlayers) {
      document.getElementById('screen-lobby').style.display = 'none';
      document.getElementById('banner-reward').innerText = "🎁 Lot : " + config.reward;
      if (config.time > 0) document.getElementById('timer-container').style.display = 'block';

      renderScoreboard();
      currentQIndex = 0;
      loadQuestion();
    }

    function renderScoreboard() {
      const sb = document.getElementById('scoreboard');
      sb.innerHTML = "";
      Object.entries(players).forEach(([id, p]) => {
        const pill = document.createElement('div');
        pill.className = 'player-pill';
        pill.innerHTML = `${p.name} : <span class="pill-score">${p.score}</span> pts`;
        sb.appendChild(pill);
      });
    }

    function generateMathProblem(opType) {
      let op = opType;
      if (op === "mix") {
        const ops = ["mult", "add", "sub", "div"];
        op = ops[Math.floor(Math.random() * ops.length)];
      }
      let text = "", ans = 0;
      if (op === "mult") {
        const a = Math.floor(Math.random() * 11), b = Math.floor(Math.random() * 11);
        ans = a * b; text = `${a} × ${b}`;
      } else if (op === "add") {
        const a = Math.floor(Math.random() * 50), b = Math.floor(Math.random() * 50);
        ans = a + b; text = `${a} + ${b}`;
      } else if (op === "sub") {
        const n1 = Math.floor(Math.random() * 50), n2 = Math.floor(Math.random() * 50);
        const a = Math.max(n1, n2), b = Math.min(n1, n2);
        ans = a - b; text = `${a} − ${b}`;
      } else if (op === "div") {
        const b = Math.floor(Math.random() * 9) + 2;
        const res = Math.floor(Math.random() * 11);
        ans = res; text = `${b * res} ÷ ${b}`;
      }
      return { text, ans };
    }

    function loadQuestion() {
      if (currentQIndex >= gameConfig.totalQ) {
        endGame();
        return;
      }
      answeredCurrent = false;
      currentProblem = gameConfig.questions[currentQIndex];
      document.getElementById('question').innerText = currentProblem.text;
      document.getElementById('banner-round').innerText = `Question : ${currentQIndex + 1} / ${gameConfig.totalQ}`;
      document.getElementById('status').innerText = "";
      resetKey();
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      questionStartTime = Date.now();
      if (gameConfig.time <= 0) return;

      let remaining = gameConfig.time * 1000;
      const bar = document.getElementById('timer-bar');

      timerInterval = setInterval(() => {
        remaining -= 100;
        bar.style.width = Math.max(0, (remaining / (gameConfig.time * 1000)) * 100) + '%';
        if (remaining <= 0) {
          clearInterval(timerInterval);
          if (!answeredCurrent) {
            submit(false, gameConfig.time * 1000);
          }
        }
      }, 100);
    }

    function pressKey(n) { if (currentInput.length < 4) { currentInput += n; document.getElementById('display-answer').innerText = currentInput; } }
    function clearKey() { currentInput = currentInput.slice(0, -1); document.getElementById('display-answer').innerText = currentInput; }
    function resetKey() { currentInput = ""; document.getElementById('display-answer').innerText = ""; }

    function validate() {
      if (currentInput === "" || answeredCurrent) return;
      clearInterval(timerInterval);
      const isCorrect = (parseInt(currentInput, 10) === currentProblem.ans);
      const elapsed = Date.now() - questionStartTime;
      submit(isCorrect, elapsed);
    }

    function submit(isCorrect, elapsed) {
      answeredCurrent = true;
      const status = document.getElementById('status');
      if (isCorrect) {
        status.innerHTML = "<span style='color:#2ed573'>Bravo ! +1 point !</span>";
      } else {
        status.innerHTML = `<span style='color:#ff4757'>Oups ! Réponse : ${currentProblem.ans}</span>`;
      }

      if (isHost) {
        if (isCorrect) players[myId].score++;
        players[myId].totalTime += elapsed;
        broadcast({ type: 'SCORE_UPDATE', players });
        renderScoreboard();
      } else if (hostConn) {
        hostConn.send({ type: 'SUBMIT_ANSWER', isCorrect, timeTaken: elapsed });
      }

      setTimeout(() => {
        currentQIndex++;
        loadQuestion();
      }, 1200);
    }

    function endGame() {
      clearInterval(timerInterval);
      const sorted = Object.values(players).sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return a.totalTime - b.totalTime;
      });
      const winner = sorted[0];

      document.getElementById('screen-winner').style.display = 'flex';
      document.getElementById('winner-name').innerText = `🏆 ${winner.name} remporte le trophée ! 🏆`;
      document.getElementById('winner-reward').innerText = `Lot gagné : ${gameConfig.reward}`;

      let html = "<strong>Classement de la manche :</strong><br><br>";
      sorted.forEach((p, idx) => {
        html += `${idx + 1}. <b>${p.name}</b> — ${p.score} pts (${(p.totalTime / 1000).toFixed(1)}s)<br>`;
      });
      document.getElementById('final-ranks').innerHTML = html;

      // Affichage des commandes selon si on est l'hôte ou un invité
      if (isHost) {
        document.getElementById('host-end-buttons').style.display = 'block';
        document.getElementById('client-wait-message').style.display = 'none';
      } else {
        document.getElementById('host-end-buttons').style.display = 'none';
        document.getElementById('client-wait-message').style.display = 'block';
      }
    }

    function leaveRoom() {
      if (peer) peer.destroy();
      location.reload();
    }
  </script>
</body>
</html>
